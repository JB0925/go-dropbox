name: go-dropbox CI script to run tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
        postgres:
          image: postgres
  
          env:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
            POSTGRES_DB: postgres
  
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          ports:
            - 5432:5432
        
        redis:
          image: redis
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 5s
            --health-timeout 3s
            --health-retries 5
          ports:
            - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.2

      - name: Download dependencies
        run: go mod download
    
      - name: Setup the database
        run: source setup-test-db.sh
        env:
            PGPASSWORD: postgres

      - name: Build the application
        run: go build -v ./...

      - name: Run tests
        run: source run-tests.sh